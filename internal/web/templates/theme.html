{{define "theme-picker"}}
<div class="theme-picker" role="group" aria-label="Appearance">
  <label title="Light theme"><input type="radio" name="appearance" value="light" data-theme-picker aria-label="Light theme"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Light</span></span></label>
  <label title="Dark theme"><input type="radio" name="appearance" value="dark" data-theme-picker aria-label="Dark theme"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg><span>Dark</span></span></label>
  <label title="Follow system appearance"><input type="radio" name="appearance" value="system" data-theme-picker aria-label="System theme"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span>System</span></span></label>
</div>
{{end}}
